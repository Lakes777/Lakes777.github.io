<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="980" viewBox="0 0 1960 980" font-family="JetBrains Mono, monospace">
  <!-- Esqueleto da tela de início (etapa 1 da /imagem-para-codigo), a partir de inicio-escolhida.png.
       Caixas sólidas = está na imagem. Tracejado laranja = proposta minha que não está na imagem. -->
  <style>
    .fundo { fill: #f4f4f2 }
    .caixa { fill: #e2e2de; stroke: #9a9a94; stroke-width: 1.2 }
    .vazio { fill: none; stroke: #9a9a94; stroke-width: 1.2 }
    .prop { fill: #fff3e8; stroke: #e07a2e; stroke-width: 1.4; stroke-dasharray: 6 4 }
    .t { fill: #3a3a36; font-size: 13px }
    .tg { fill: #3a3a36; font-size: 30px; font-weight: 700 }
    .tm { fill: #3a3a36; font-size: 24px; font-weight: 700 }
    .n { fill: #8a8a84; font-size: 11px }
    .np { fill: #c0601c; font-size: 11px }
    .ativo { fill: #3a3a36; font-weight: 700 }
    .liga { fill: none; stroke: #9a9a94; stroke-width: 1.2 }
    .titulo { fill: #1a1a18; font-size: 15px; font-weight: 700 }
  </style>
  <rect class="fundo" width="1960" height="980"/>

  <text class="titulo" x="40" y="34">DESKTOP · 1440 × 900</text>
  <g transform="translate(40,50)">
    <rect width="1440" height="900" fill="#fff" stroke="#9a9a94"/>

    <!-- barra do topo (fixa, vale para as 6 abas) -->
    <rect class="vazio" x="0" y="0" width="1440" height="64"/>
    <text class="t" x="56" y="38" font-weight="700" font-size="16">André Lagos</text>
    <line x1="178" y1="22" x2="178" y2="44" stroke="#9a9a94"/>
    <text class="t" x="194" y="37">back-end · APIs · bancos · filas</text>
    <text class="t ativo" x="800" y="37">01 início</text>
    <text class="t" x="896" y="37">02 sobre</text>
    <text class="t" x="982" y="37">03 formação</text>
    <text class="t" x="1090" y="37">04 projetos</text>
    <text class="t" x="1198" y="37">05 habilidades</text>
    <text class="t" x="1330" y="37">06 contato</text>
    <rect class="caixa" x="798" y="58" width="74" height="3"/>
    <text class="n" x="800" y="84">[nav: abas por endereço, a ativa com traço embaixo]</text>

    <!-- coluna esquerda -->
    <text class="n" x="200" y="112">[h1]</text>
    <text class="tg" x="200" y="150">Do banco de dados</text>
    <text class="tg" x="200" y="192">ao <tspan text-decoration="underline">deploy</tspan>.</text>
    <text class="n" x="420" y="192">← "deploy." na cor de destaque</text>

    <text class="n" x="200" y="226">[lead, 3 linhas]</text>
    <rect class="caixa" x="200" y="236" width="460" height="10"/>
    <rect class="caixa" x="200" y="256" width="460" height="10"/>
    <rect class="caixa" x="200" y="276" width="300" height="10"/>
    <text class="t" x="200" y="248" opacity="0">Estudante...</text>

    <text class="n" x="200" y="318">[números, separados por linha vertical]</text>
    <text class="tm" x="200" y="356">13</text><text class="t" x="200" y="378">projetos no GitHub</text>
    <line x1="360" y1="334" x2="360" y2="384" stroke="#9a9a94"/>
    <text class="tm" x="380" y="356">10</text><text class="t" x="380" y="378">sites no ar</text>
    <line x1="520" y1="334" x2="520" y2="384" stroke="#9a9a94"/>
    <text class="tm" x="540" y="356">4.000+</text><text class="t" x="540" y="378">testes automatizados</text>

    <text class="n" x="200" y="420">[botões — redesenhar na etapa 3: hoje parecem básicos]</text>
    <rect class="caixa" x="200" y="430" width="150" height="40" rx="4"/><text class="t" x="222" y="455" font-weight="700">ver projetos →</text>
    <rect class="vazio" x="362" y="430" width="106" height="40" rx="4"/><text class="t" x="380" y="455">◯ github</text>
    <rect class="vazio" x="480" y="430" width="124" height="40" rx="4"/><text class="t" x="498" y="455">▢ linkedin</text>

    <!-- ilustração: diagrama isométrico dos sistemas -->
    <text class="n" x="800" y="112">[ilustração isométrica: SVG próprio, animado na etapa 4]</text>
    <rect class="vazio" x="800" y="122" width="590" height="400" stroke-dasharray="2 3"/>
    <path class="liga" d="M1090 330 L960 250 M1090 330 L1240 240 M1090 330 L930 360 M1090 330 L1260 380 M1090 330 L1000 450 M1090 330 L1300 460"/>
    <rect class="caixa" x="1040" y="280" width="100" height="100" rx="8"/><text class="t" x="1074" y="336" font-weight="700">SQL</text>
    <rect class="caixa" x="900" y="210" width="110" height="46" rx="6"/><text class="t" x="918" y="238">&lt;/&gt; API</text>
    <rect class="caixa" x="1200" y="196" width="100" height="56" rx="6"/><text class="t" x="1226" y="230">APPS</text>
    <rect class="caixa" x="860" y="330" width="80" height="70" rx="4"/><text class="n" x="870" y="370">servidores</text>
    <rect class="caixa" x="1230" y="350" width="90" height="80" rx="4"/><text class="n" x="1246" y="394">Docker</text>
    <rect class="caixa" x="940" y="440" width="110" height="40" rx="6"/><text class="t" x="962" y="465">▤ FILAS</text>
    <rect class="caixa" x="1250" y="450" width="120" height="40" rx="6"/><text class="t" x="1270" y="475">☁ DEPLOY</text>
    <text class="np" x="800" y="545">proposta: rótulos com as SUAS stacks no hover (API: Spring·Go·.NET·Nest; SQL: PostgreSQL;</text>
    <text class="np" x="800" y="561">FILAS: Kafka·RabbitMQ·BullMQ; DEPLOY: Docker·Oracle·Vercel) e cada nó levando à aba de projetos</text>

    <!-- propostas para o que hoje fica na coluna da esquerda -->
    <rect class="prop" x="200" y="620" width="1190" height="56" rx="6"/>
    <text class="np" x="216" y="640">proposta: faixa do Vigil (substitui o pulso da coluna da esquerda)</text>
    <text class="t" x="216" y="662">● 10/10 sites no ar · verificado há 2 min pelo Vigil              ∿∿∿ pulso ∿∿∿</text>

    <rect class="prop" x="0" y="840" width="1440" height="60"/>
    <text class="np" x="56" y="862">proposta: rodapé fino (substitui os contatos da coluna da esquerda)</text>
    <text class="t" x="56" y="884">andreplagoscontato@gmail.com · github.com/Lakes777 · linkedin.com/in/andre-lagos               © 2026 André Lagos</text>

    <text class="n" x="200" y="740">fundo: escuro com grade de pontos/linhas bem apagada (a rede de hoje, mais discreta)</text>
  </g>

  <!-- celular -->
  <text class="titulo" x="1530" y="34">CELULAR · 390</text>
  <g transform="translate(1530,50)">
    <rect width="390" height="900" fill="#fff" stroke="#9a9a94"/>
    <text class="t" x="16" y="34" font-weight="700" font-size="15">André Lagos</text>
    <text class="n" x="16" y="52">back-end · APIs · bancos · filas</text>
    <rect class="vazio" x="0" y="66" width="390" height="40"/>
    <text class="t" x="16" y="91"><tspan class="ativo">início</tspan>  sobre  formação  projetos  hab…</text>
    <text class="n" x="16" y="122">[abas: barra que rola de lado, presa no topo]</text>
    <text class="tm" x="16" y="166">Do banco de dados</text>
    <text class="tm" x="16" y="196">ao deploy.</text>
    <rect class="caixa" x="16" y="214" width="358" height="9"/>
    <rect class="caixa" x="16" y="232" width="358" height="9"/>
    <rect class="caixa" x="16" y="250" width="240" height="9"/>
    <rect class="vazio" x="16" y="278" width="358" height="200" stroke-dasharray="2 3"/>
    <text class="n" x="30" y="382">[ilustração menor, sem rótulos de hover]</text>
    <text class="tm" x="16" y="516">13</text><text class="n" x="16" y="532">projetos</text>
    <text class="tm" x="136" y="516">10</text><text class="n" x="136" y="532">no ar</text>
    <text class="tm" x="250" y="516">4.000+</text><text class="n" x="250" y="532">testes</text>
    <rect class="caixa" x="16" y="560" width="358" height="44" rx="4"/><text class="t" x="140" y="587" font-weight="700">ver projetos →</text>
    <rect class="vazio" x="16" y="614" width="173" height="44" rx="4"/><text class="t" x="70" y="641">github</text>
    <rect class="vazio" x="201" y="614" width="173" height="44" rx="4"/><text class="t" x="248" y="641">linkedin</text>
    <rect class="prop" x="16" y="680" width="358" height="44" rx="6"/><text class="t" x="28" y="707">● 10/10 no ar · Vigil</text>
  </g>
</svg>
