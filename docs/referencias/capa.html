<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">

  html, body { width: 1200px; height: 627px; overflow: hidden }
  /* A névoa forte, que no site só aparece no início */
  html { --nevoa: 1 }
  .capa { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 540px 1fr; align-items: center; padding: 0 0 0 80px }
  .capa__nome { font: 500 30px/1 var(--serifa); margin: 0 }
  .capa__papel { font: 400 15px/1 var(--mono); color: var(--apagado); margin: 14px 0 0 }
  .capa__frase { font: 400 76px/.98 var(--serifa); letter-spacing: -.035em; margin: 46px 0 0 }
  .capa__frase em { color: var(--destaque) }
  .capa__site { display: flex; align-items: center; gap: 12px; font: 400 16px/1 var(--mono); color: var(--destaque-claro); margin: 44px 0 0 }
  .capa__site::before { content: ""; width: 26px; height: 1px; background: var(--destaque) }
  .capa__ceu { width: 560px; height: 560px; margin-left: 0; perspective: 1400px }
  .capa .planetario__svg { transform: rotateX(16deg) }
  /* Estrelas paradas no fundo (no site, o canvas) */
  body::after { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .7;
    background-image: radial-gradient(1px 1px at 12% 18%, #d6e0ff, transparent), radial-gradient(1px 1px at 33% 72%, #d6e0ff, transparent),
      radial-gradient(1.4px 1.4px at 48% 12%, #fff, transparent), radial-gradient(1px 1px at 8% 88%, #d6e0ff, transparent),
      radial-gradient(1px 1px at 62% 92%, #d6e0ff, transparent), radial-gradient(1.4px 1.4px at 92% 8%, #fff, transparent),
      radial-gradient(1px 1px at 41% 40%, #d6e0ff, transparent), radial-gradient(1px 1px at 97% 61%, #d6e0ff, transparent),
      radial-gradient(1px 1px at 22% 50%, #d6e0ff, transparent), radial-gradient(1px 1px at 74% 4%, #d6e0ff, transparent) }
</style>
